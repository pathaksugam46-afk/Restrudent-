<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Place For Every Taste – Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8e8e6;--card:#f5f5f3;--ink:#1f1f1f;--muted:#5a5a5a;--head:#3a3a3a;--brush:#3a3a3a;--brush-ink:#fff;--accent:#c8402d;--line:#cfcfcb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1c;--card:#272727;--ink:#f0f0ee;--muted:#a8a8a4;--head:#111;--brush:#d9d9d5;--brush-ink:#1c1c1c;--line:#3a3a3a}}
:root[data-theme="dark"]{--bg:#1c1c1c;--card:#272727;--ink:#f0f0ee;--muted:#a8a8a4;--head:#111;--brush:#d9d9d5;--brush-ink:#1c1c1c;--line:#3a3a3a}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;line-height:1.5}
header{background:var(--head);color:#fff;padding:28px 20px 24px;border-bottom:8px solid #7a7a78}
.wrap{max-width:960px;margin:0 auto}
h1{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:clamp(34px,8vw,60px);line-height:1.02;margin:0;letter-spacing:.5px}
h1 small{display:block;font-size:.55em;margin-top:4px}
.brand{margin:14px 0 0;color:#cfcfcb;font-size:14px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:10px 16px;scrollbar-width:none}
nav a{display:inline-block;margin-right:8px;padding:6px 14px;border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;font-size:13px;font-weight:500;border:1px solid var(--line)}
nav a:focus-visible,nav a:hover{outline:2px solid var(--accent)}
main{max-width:960px;margin:0 auto;padding:8px 16px 24px;display:grid;gap:8px 32px;grid-template-columns:1fr}
@media(min-width:720px){main{grid-template-columns:1fr 1fr}}
section{padding-top:20px}
h2{display:inline-block;margin:0 0 12px -6px;padding:8px 34px 8px 18px;background:var(--brush);color:var(--brush-ink);font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:20px;letter-spacing:.5px;clip-path:polygon(0 12%,6% 0,30% 6%,58% 0,84% 5%,100% 0,97% 45%,100% 100%,70% 92%,42% 100%,15% 94%,2% 100%,4% 55%)}
.note{margin:-4px 0 10px;font-size:13px;color:var(--muted)}
.styles{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.styles span{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--accent);color:var(--accent)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dotted var(--line);font-size:15px}
li b{font-weight:600;white-space:nowrap}
footer{background:var(--head);color:#fff;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
footer .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
footer strong{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:20px;display:block}
footer a{color:#fff;font-size:22px;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<header><div class="wrap">
<h1>A Place<small>For Every Taste</small></h1>
<p class="brand">Fast food menu · Restaurant Name</p>
</div></header>
<nav id="nav" aria-label="Menu categories"></nav>
<main id="menu"></main>
<footer><div class="wrap">
<span style="font-size:32px" aria-hidden="true">🛵</span>
<div><strong>Free delivery</strong><a href="tel:2225557777" id="phone">222 555 7777</a></div>
</div></footer>
<script>
// EDIT HERE: add a price (number) to any item, e.g. ["Veg Momo", 150]. Items without a price show none.
var CURRENCY = "Rs.";
var MENU = [
 {id:"momo",title:"Momo",styles:["Steam","Jhol","Chilli","Fry"],note:"Every momo is available in all four styles.",items:[["Veg Momo"],["Chicken Momo"],["Mutton Momo"],["Buff Momo"],["Paneer Momo"],["Pork Momo"]]},
 {id:"chowmein",title:"Chowmein",items:[["Veg Chowmein"],["Paneer Chowmein"],["Buff Chowmein"],["Chicken Chowmein"],["Egg Chowmein"]]},
 {id:"biryani",title:"Biryani",items:[["Veg Biryani"],["Chicken Biryani"],["Mutton Biryani"],["Egg Biryani"],["Hyderabadi Biryani"],["Fish Biryani"],["Kolkata Biryani"],["Mughlai Biryani"]]},
 {id:"friedrice",title:"Fried Rice",items:[["Veg Fried Rice"],["Chicken Fried Rice"],["Egg Fried Rice"]]},
 {id:"chatpate",title:"Chatpate",items:[["Veg Chatpate"],["Non-veg Chatpate"],["Chicken Chatpate"]]},
 {id:"puri",title:"Puri Tarkari",items:[["Puri Tarkari"]]},
 {id:"chana",title:"Chana Chura",items:[["Chana Chura"]]},
 {id:"thukpa",title:"Thukpa",items:[["Veg Thukpa"],["Chicken Thukpa"],["Egg Thukpa"],["Buff Thukpa"]]},
 {id:"roll",title:"Rolls",items:[["Chicken Roll"],["Chicken Kathi Roll"],["Egg Roll"],["Egg Chicken Roll"],["Paneer Roll"],["Veg Roll"],["Sausage Roll"],["Spring Roll"],["Chicken Cheese Roll"],["Mushroom Roll"],["Mixed Roll (Chicken + Egg + Veg)"]]},
 {id:"pizza",title:"Pizza",items:[["Chicken Pizza"],["Cheese Pizza"],["Veg Pizza"],["Chicken Mushroom Pizza"],["Sausage Pizza"],["Buff Pizza"],["Mix Pizza"],["Paneer Pizza"],["Chicken Salami Pizza"],["Margherita Pizza"]]},
 {id:"pakoda",title:"Pakoda",items:[["Veg Pakoda"],["Onion Pakoda"],["Paneer Pakoda"],["Mushroom Pakoda"],["Chicken Pakoda"],["Mixed Vegetable Pakoda"],["Dal Pakoda"]]},
 {id:"paratha",title:"Paratha",items:[["Aloo Paratha"],["Plain Paratha"],["Paneer Paratha"],["Chicken Paratha"],["Egg Paratha"],["Cheese Paratha"],["Mixed Veg Paratha"],["Onion Paratha"]]},
 {id:"keema",title:"Keema Noodles",items:[["Chicken Keema Noodles"],["Mutton Keema Noodles"],["Buff Keema Noodles"],["Mixed Keema Noodles"],["Spicy Keema Noodles"]]}
];
var nav=document.getElementById("nav"),menu=document.getElementById("menu");
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
MENU.forEach(function(c){
 nav.insertAdjacentHTML("beforeend",'<a href="#'+c.id+'">'+esc(c.title)+'</a>');
 var h='<section id="'+c.id+'"><h2>'+esc(c.title)+'</h2>';
 if(c.styles)h+='<div class="styles">'+c.styles.map(function(s){return "<span>"+esc(s)+"</span>"}).join("")+"</div>";
 if(c.note)h+='<p class="note">'+esc(c.note)+"</p>";
 h+="<ul>"+c.items.map(function(i){return "<li><span>"+esc(i[0])+"</span>"+(i[1]!=null?"<b>"+CURRENCY+" "+i[1]+"</b>":"")+"</li>"}).join("")+"</ul></section>";
 menu.insertAdjacentHTML("beforeend",h);
});
</script>
</body>
</html>
